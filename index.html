<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แนะนำพนักงานให้ทีม - Employee Directory</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1><i class="fas fa-users"></i> แนะนำพนักงานให้ทีม</h1>
                <p>พบกับทีมงานผู้มากความสามารถของเรา</p>
            </div>
            <button id="addEmployeeBtn" class="btn btn-primary">
                <i class="fas fa-user-plus"></i> เพิ่มพนักงาน
            </button>
        </header>

        <!-- Search and Filter -->
        <div class="search-filter">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ค้นหาชื่อหรือตำแหน่ง...">
            </div>
            <select id="departmentFilter" class="filter-select">
                <option value="">ทั้งหมด</option>
                <option value="พัฒนาเว็บ">พัฒนาเว็บ</option>
                <option value="ดีไซน์">ดีไซน์</option>
                <option value="การตลาด">การตลาด</option>
                <option value="ฝ่ายขาย">ฝ่ายขาย</option>
                <option value="บริหาร">บริหาร</option>
            </select>
        </div>

        <!-- Employee Grid -->
        <div id="employeeGrid" class="employee-grid">
            <!-- Employees will be loaded here dynamically -->
        </div>

        <!-- Loading State -->
        <div id="loading" class="loading" style="display: none;">
            <i class="fas fa-spinner fa-spin"></i>
            <p>กำลังโหลดข้อมูล...</p>
        </div>
    </div>

    <!-- Add/Edit Employee Modal -->
    <div id="employeeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle"><i class="fas fa-user"></i> เพิ่มพนักงานใหม่</h2>
                <span class="close">&times;</span>
            </div>
            <form id="employeeForm">
                <input type="hidden" id="employeeId">
                <div class="form-group">
                    <label for="firstName">ชื่อ</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">นามสกุล</label>
                    <input type="text" id="lastName" required>
                </div>
                <div class="form-group">
                    <label for="position">ตำแหน่ง</label>
                    <input type="text" id="position" required>
                </div>
                <div class="form-group">
                    <label for="department">แผนก</label>
                    <select id="department" required>
                        <option value="">เลือกแผนก</option>
                        <option value="พัฒนาเว็บ">พัฒนาเว็บ</option>
                        <option value="ดีไซน์">ดีไซน์</option>
                        <option value="การตลาด">การตลาด</option>
                        <option value="ฝ่ายขาย">ฝ่ายขาย</option>
                        <option value="บริหาร">บริหาร</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="email">อีเมล</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">เบอร์โทร</label>
                    <input type="tel" id="phone">
                </div>
                <div class="form-group">
                    <label for="bio">ประวัติโดยย่อ</label>
                    <textarea id="bio" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="profileImage">URL รูปภาพ</label>
                    <input type="url" id="profileImage" placeholder="https://example.com/image.jpg">
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-save"></i> บันทึก
                </button>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content delete-modal">
            <div class="modal-header">
                <h2><i class="fas fa-exclamation-triangle" style="color: #e74c3c;"></i> ยืนยันการลบ</h2>
                <span class="close-delete">&times;</span>
            </div>
            <p>คุณแน่ใจว่าต้องการลบพนักงานคนนี้?</p>
            <div class="delete-actions">
                <button id="confirmDelete" class="btn btn-danger">
                    <i class="fas fa-trash"></i> ลบ
                </button>
                <button id="cancelDelete" class="btn btn-secondary">
                    <i class="fas fa-times"></i> ยกเลิก
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
