<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แนะนำพนักงานให้ทีม - Employee Directory</title>
    
    <style>
        /* ========== CSS Reset & Base ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden; /* ป้องกันการเลื่อนแนวนอน */
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        /* ========== Header ========== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-content h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-content h1 i {
            -webkit-text-fill-color: #667eea;
        }

        .header-content p {
            color: #666;
            margin-top: 5px;
        }

        /* ========== Buttons ========== */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-family: 'Prompt', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #00b894 0%, #00a86b 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 184, 148, 0.4);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
            padding: 14px;
        }

        /* ========== Search and Filter ========== */
        .search-filter {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            position: relative;
            min-width: 250px;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Prompt', sans-serif;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-select {
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Prompt', sans-serif;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            min-width: 150px;
        }

        .filter-select:focus {
            outline: none;
            border-color: #667eea;
        }

        /* ========== Employee Grid ========== */
        .employee-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .employee-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            position: relative;
            border: 2px solid transparent;
        }

        .employee-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .employee-card .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #667eea;
            margin-bottom: 15px;
        }

        .employee-card .name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .employee-card .position {
            color: #667eea;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .employee-card .department {
            display: inline-block;
            background: #f0f0f0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 10px;
        }

        .employee-card .email,
        .employee-card .phone {
            font-size: 0.9rem;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 3px 0;
        }

        .employee-card .bio {
            font-size: 0.9rem;
            color: #888;
            margin-top: 10px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .employee-card .actions {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
        }

        .employee-card .actions button {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .employee-card .actions .edit-btn {
            background: #667eea;
            color: white;
        }

        .employee-card .actions .edit-btn:hover {
            background: #5a67d8;
            transform: scale(1.1);
        }

        .employee-card .actions .delete-btn {
            background: #e74c3c;
            color: white;
        }

        .employee-card .actions .delete-btn:hover {
            background: #c0392b;
            transform: scale(1.1);
        }

        /* ========== Loading ========== */
        .loading {
            text-align: center;
            padding: 50px;
            color: #667eea;
        }

        .loading i {
            font-size: 3rem;
        }

        /* ========== Modal ========== */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s;
            overflow-y: auto; /* ป้องกันเนื้อหาล้น */
            padding: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            margin: 20px auto;
            padding: 0;
            width: 100%;
            max-width: 550px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.3s;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ========== Modal Header ========== */
        .modal-header {
            padding: 25px 30px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px 20px 0 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .modal-header h2 {
            font-size: 1.4rem;
            color: white;
            margin: 0;
        }

        .modal-header h2 i {
            margin-right: 10px;
        }

        .close {
            font-size: 2rem;
            cursor: pointer;
            color: white;
            transition: transform 0.3s;
            line-height: 1;
        }

        .close:hover {
            transform: rotate(90deg);
        }

        /* ========== Modal Body (Form) ========== */
        .modal-body {
            padding: 30px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.95rem;
        }

        .form-group label .required {
            color: #e74c3c;
            margin-left: 4px;
        }

        .form-group label i {
            color: #667eea;
            margin-right: 8px;
            width: 18px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Prompt', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s;
            background: #fafafa;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-group input:hover,
        .form-group select:hover,
        .form-group textarea:hover {
            border-color: #a8b5f0;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group .input-icon {
            position: relative;
        }

        .form-group .input-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .form-group .input-icon input {
            padding-left: 45px;
        }

        /* ========== Modal Footer ========== */
        .modal-footer {
            padding: 20px 30px 30px;
            border-top: 2px solid #f0f0f0;
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            background: #fafafa;
            border-radius: 0 0 20px 20px;
        }

        .modal-footer .btn {
            padding: 12px 30px;
            min-width: 120px;
            justify-content: center;
        }

        /* ========== Delete Modal ========== */
        .delete-modal {
            max-width: 420px;
        }

        .delete-modal .modal-header {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .delete-modal p {
            padding: 30px;
            font-size: 1.1rem;
            color: #2c3e50;
            text-align: center;
            margin: 0;
        }

        .delete-modal p i {
            font-size: 3rem;
            color: #e74c3c;
            display: block;
            margin-bottom: 15px;
        }

        .delete-actions {
            padding: 0 30px 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .delete-actions .btn {
            flex: 1;
            justify-content: center;
            padding: 12px;
        }

        /* ========== Empty State ========== */
        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state i {
            font-size: 4rem;
            color: #dce0e6;
        }

        .empty-state h3 {
            color: #2c3e50;
            margin-top: 20px;
            font-size: 1.3rem;
        }

        .empty-state p {
            color: #999;
            margin-top: 10px;
        }

        /* ========== Toast Notification ========== */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-family: 'Prompt', sans-serif;
            font-weight: 600;
            z-index: 2000;
            animation: slideIn 0.5s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 400px;
        }

        .toast.success {
            background: linear-gradient(135deg, #00b894, #00a86b);
        }

        .toast.error {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ========== Responsive ========== */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .header-content h1 {
                font-size: 1.5rem;
            }
            
            .search-filter {
                flex-direction: column;
            }
            
            .search-box {
                min-width: 100%;
            }
            
            .filter-select {
                width: 100%;
            }
            
            .employee-grid {
                grid-template-columns: 1fr;
            }
            
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .modal-content {
                margin: 10px auto;
                width: 100%;
                max-height: 95vh;
            }

            .modal-header {
                padding: 20px;
            }

            .modal-header h2 {
                font-size: 1.1rem;
            }

            .modal-body {
                padding: 20px;
            }

            .modal-footer {
                flex-direction: column;
                padding: 15px 20px 20px;
            }

            .modal-footer .btn {
                width: 100%;
            }

            .toast {
                top: 10px;
                right: 10px;
                left: 10px;
                max-width: none;
                font-size: 0.9rem;
                padding: 12px 18px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 12px;
                border-radius: 15px;
            }

            .btn {
                padding: 10px 18px;
                font-size: 0.9rem;
            }

            .employee-card {
                padding: 18px;
            }

            .modal-content {
                border-radius: 15px;
            }

            .modal-header {
                border-radius: 15px 15px 0 0;
            }
        }

        /* ========== Scrollbar styling ========== */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5a67d8;
        }

        /* ========== Font imports ========== */
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap');
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1><i class="fas fa-users"></i> แนะนำพนักงานให้ทีม</h1>
                <p>พบกับทีมงานผู้มากความสามารถของเรา</p>
            </div>
            <button id="addEmployeeBtn" class="btn btn-primary">
                <i class="fas fa-user-plus"></i> เพิ่มพนักงาน
            </button>
        </header>

        <!-- Search and Filter -->
        <div class="search-filter">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ค้นหาชื่อหรือตำแหน่ง...">
            </div>
            <select id="departmentFilter" class="filter-select">
                <option value="">📋 ทั้งหมด</option>
                <option value="พัฒนาเว็บ">💻 พัฒนาเว็บ</option>
                <option value="ดีไซน์">🎨 ดีไซน์</option>
                <option value="การตลาด">📊 การตลาด</option>
                <option value="ฝ่ายขาย">💰 ฝ่ายขาย</option>
                <option value="บริหาร">👔 บริหาร</option>
            </select>
        </div>

        <!-- Employee Grid -->
        <div id="employeeGrid" class="employee-grid">
            <!-- Employees will be loaded here dynamically -->
        </div>

        <!-- Loading State -->
        <div id="loading" class="loading" style="display: none;">
            <i class="fas fa-spinner fa-spin"></i>
            <p>กำลังโหลดข้อมูล...</p>
        </div>
    </div>

    <!-- ========== ADD/EDIT EMPLOYEE MODAL ========== -->
    <div id="employeeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle"><i class="fas fa-user-plus"></i> เพิ่มพนักงานใหม่</h2>
                <span class="close">&times;</span>
            </div>
            
            <form id="employeeForm">
                <input type="hidden" id="employeeId">
                
                <div class="modal-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> ชื่อ <span class="required">*</span></label>
                            <input type="text" id="firstName" placeholder="เช่น สมชาย" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> นามสกุล <span class="required">*</span></label>
                            <input type="text" id="lastName" placeholder="เช่น ใจดี" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-briefcase"></i> ตำแหน่ง <span class="required">*</span></label>
                            <input type="text" id="position" placeholder="เช่น นักพัฒนา Frontend" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-building"></i> แผนก <span class="required">*</span></label>
                            <select id="department" required>
                                <option value="">เลือกแผนก</option>
                                <option value="พัฒนาเว็บ">💻 พัฒนาเว็บ</option>
                                <option value="ดีไซน์">🎨 ดีไซน์</option>
                                <option value="การตลาด">📊 การตลาด</option>
                                <option value="ฝ่ายขาย">💰 ฝ่ายขาย</option>
                                <option value="บริหาร">👔 บริหาร</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-envelope"></i> อีเมล <span class="required">*</span></label>
                            <input type="email" id="email" placeholder="somchai@company.com" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-phone"></i> เบอร์โทร</label>
                            <input type="tel" id="phone" placeholder="081-234-5678">
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-image"></i> URL รูปภาพ</label>
                        <input type="url" id="profileImage" placeholder="https://example.com/avatar.jpg">
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-file-alt"></i> ประวัติโดยย่อ</label>
                        <textarea id="bio" rows="3" placeholder="แนะนำตัวสั้นๆ..."></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">
                        <i class="fas fa-times"></i> ยกเลิก
                    </button>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> <span id="submitBtnText">บันทึก</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ========== DELETE CONFIRMATION MODAL ========== -->
    <div id="deleteModal" class="modal">
        <div class="modal-content delete-modal">
            <div class="modal-header">
                <h2><i class="fas fa-trash"></i> ยืนยันการลบ</h2>
                <span class="close-delete">&times;</span>
            </div>
            <p>
                <i class="fas fa-exclamation-triangle"></i>
                คุณแน่ใจว่าต้องการลบพนักงานคนนี้?<br>
                <small style="color: #999; font-size: 0.85rem;">การดำเนินการนี้ไม่สามารถย้อนกลับได้</small>
            </p>
            <div class="delete-actions">
                <button id="cancelDelete" class="btn btn-secondary">
                    <i class="fas fa-times"></i> ยกเลิก
                </button>
                <button id="confirmDelete" class="btn btn-danger">
                    <i class="fas fa-trash"></i> ลบ
                </button>
            </div>
        </div>
    </div>

    <!-- ========== TOAST NOTIFICATION ========== -->
    <div id="toast" class="toast" style="display: none;"></div>

    <!-- ========== Font Awesome ========== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- ========== JAVASCRIPT ========== -->
    <script>
        // API URL
        const API_URL = '/api/employees';

        // DOM Elements
        const employeeGrid = document.getElementById('employeeGrid');
        const searchInput = document.getElementById('searchInput');
        const departmentFilter = document.getElementById('departmentFilter');
        const loading = document.getElementById('loading');
        const addEmployeeBtn = document.getElementById('addEmployeeBtn');

        // Modal Elements
        const employeeModal = document.getElementById('employeeModal');
        const deleteModal = document.getElementById('deleteModal');
        const modalTitle = document.getElementById('modalTitle');
        const employeeForm = document.getElementById('employeeForm');
        const employeeIdInput = document.getElementById('employeeId');
        const firstNameInput = document.getElementById('firstName');
        const lastNameInput = document.getElementById('lastName');
        const positionInput = document.getElementById('position');
        const departmentInput = document.getElementById('department');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const bioInput = document.getElementById('bio');
        const profileImageInput = document.getElementById('profileImage');
        const submitBtnText = document.getElementById('submitBtnText');
        const cancelBtn = document.getElementById('cancelBtn');

        // Toast
        const toast = document.getElementById('toast');
        let toastTimeout;

        // Close buttons
        const closeModal = document.querySelector('.close');
        const closeDelete = document.querySelector('.close-delete');
        const cancelDelete = document.getElementById('cancelDelete');
        const confirmDelete = document.getElementById('confirmDelete');

        let currentDeleteId = null;

        // ============== Toast Functions ==============
        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.style.display = 'block';
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // ============== API Functions ==============

        async function fetchEmployees() {
            showLoading(true);
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Failed to fetch employees');
                const employees = await response.json();
                renderEmployees(employees);
            } catch (error) {
                console.error('Error fetching employees:', error);
                showError('ไม่สามารถโหลดข้อมูลพนักงานได้');
            } finally {
                showLoading(false);
            }
        }

        async function addEmployee(employeeData) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(employeeData)
                });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to add employee');
                }
                return await response.json();
            } catch (error) {
                console.error('Error adding employee:', error);
                throw error;
            }
        }

        async function updateEmployee(id, employeeData) {
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(employeeData)
                });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to update employee');
                }
                return await response.json();
            } catch (error) {
                console.error('Error updating employee:', error);
                throw error;
            }
        }

        async function deleteEmployee(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to delete employee');
                }
                return true;
            } catch (error) {
                console.error('Error deleting employee:', error);
                throw error;
            }
        }

        // ============== Render Functions ==============

        function renderEmployees(employees) {
            if (employees.length === 0) {
                employeeGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-users"></i>
                        <h3>ไม่พบข้อมูลพนักงาน</h3>
                        <p>คลิกปุ่ม "เพิ่มพนักงาน" เพื่อเริ่มต้น</p>
                    </div>
                `;
                return;
            }

            employeeGrid.innerHTML = employees.map(emp => `
                <div class="employee-card" data-id="${emp.id}">
                    <div class="actions">
                        <button class="edit-btn" onclick="editEmployee('${emp.id}')" title="แก้ไข">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="delete-btn" onclick="confirmDeleteEmployee('${emp.id}')" title="ลบ">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                    <img src="${emp.profileImage || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(emp.firstName + ' ' + emp.lastName) + '&background=667eea&color=fff&size=80'}" 
                         alt="${emp.firstName} ${emp.lastName}" 
                         class="avatar">
                    <div class="name">${emp.firstName} ${emp.lastName}</div>
                    <div class="position">${emp.position}</div>
                    <span class="department">${emp.department}</span>
                    <div class="email"><i class="fas fa-envelope"></i> ${emp.email}</div>
                    ${emp.phone ? `<div class="phone"><i class="fas fa-phone"></i> ${emp.phone}</div>` : ''}
                    ${emp.bio ? `<div class="bio">${emp.bio}</div>` : ''}
                </div>
            `).join('');
        }

        function showLoading(show) {
            loading.style.display = show ? 'block' : 'none';
            if (show) {
                employeeGrid.innerHTML = '';
            }
        }

        function showError(message) {
            employeeGrid.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #e74c3c;">
                    <i class="fas fa-exclamation-circle" style="font-size: 3rem;"></i>
                    <p style="margin-top: 15px;">${message}</p>
                    <button onclick="fetchEmployees()" class="btn btn-primary" style="margin-top: 15px;">
                        <i class="fas fa-sync"></i> ลองใหม่
                    </button>
                </div>
            `;
        }

        // ============== Filter Functions ==============

        function filterEmployees() {
            const searchTerm = searchInput.value.toLowerCase();
            const department = departmentFilter.value;

            const cards = document.querySelectorAll('.employee-card');
            cards.forEach(card => {
                const name = card.querySelector('.name')?.textContent?.toLowerCase() || '';
                const position = card.querySelector('.position')?.textContent?.toLowerCase() || '';
                const dept = card.querySelector('.department')?.textContent || '';
                
                const matchesSearch = name.includes(searchTerm) || position.includes(searchTerm);
                const matchesDept = !department || dept === department;
                
                card.style.display = (matchesSearch && matchesDept) ? 'block' : 'none';
            });
        }

        // ============== Modal Functions ==============

        function openModal(employee = null) {
            if (employee) {
                modalTitle.innerHTML = '<i class="fas fa-user-edit"></i> แก้ไขข้อมูลพนักงาน';
                employeeIdInput.value = employee.id;
                firstNameInput.value = employee.firstName;
                lastNameInput.value = employee.lastName;
                positionInput.value = employee.position;
                departmentInput.value = employee.department;
                emailInput.value = employee.email;
                phoneInput.value = employee.phone || '';
                bioInput.value = employee.bio || '';
                profileImageInput.value = employee.profileImage || '';
                submitBtnText.textContent = 'อัพเดท';
            } else {
                modalTitle.innerHTML = '<i class="fas fa-user-plus"></i> เพิ่มพนักงานใหม่';
                employeeForm.reset();
                employeeIdInput.value = '';
                submitBtnText.textContent = 'บันทึก';
            }
            employeeModal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModalFn() {
            employeeModal.style.display = 'none';
            document.body.style.overflow = 'auto';
            employeeForm.reset();
        }

        function confirmDeleteEmployee(id) {
            currentDeleteId = id;
            deleteModal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeDeleteModal() {
            deleteModal.style.display = 'none';
            document.body.style.overflow = 'auto';
            currentDeleteId = null;
        }

        // ============== Event Handlers ==============

        // Add employee button
        addEmployeeBtn.addEventListener('click', () => openModal());

        // Cancel button in form
        cancelBtn.addEventListener('click', closeModalFn);

        // Close modal buttons
        closeModal.addEventListener('click', closeModalFn);
        closeDelete.addEventListener('click', closeDeleteModal);
        cancelDelete.addEventListener('click', closeDeleteModal);

        // Close modals on outside click
        window.addEventListener('click', (e) => {
            if (e.target === employeeModal) closeModalFn();
            if (e.target === deleteModal) closeDeleteModal();
        });

        // Edit employee (global function)
        window.editEmployee = async function(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`);
                if (!response.ok) throw new Error('Failed to fetch employee');
                const employee = await response.json();
                openModal(employee);
            } catch (error) {
                console.error('Error fetching employee:', error);
                showToast('ไม่สามารถโหลดข้อมูลพนักงานได้', 'error');
            }
        };

        // Confirm delete (global function)
        window.confirmDeleteEmployee = confirmDeleteEmployee;

        // Delete confirmation
        confirmDelete.addEventListener('click', async () => {
            if (!currentDeleteId) return;
            try {
                await deleteEmployee(currentDeleteId);
                closeDeleteModal();
                await fetchEmployees();
                showToast('ลบพนักงานเรียบร้อยแล้ว ✅', 'success');
            } catch (error) {
                showToast('ไม่สามารถลบพนักงานได้: ' + error.message, 'error');
            }
        });

        // Form submit
        employeeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const employeeData = {
                firstName: firstNameInput.value.trim(),
                lastName: lastNameInput.value.trim(),
                position: positionInput.value.trim(),
                department: departmentInput.value,
                email: emailInput.value.trim(),
                phone: phoneInput.value.trim(),
                bio: bioInput.value.trim(),
                profileImage: profileImageInput.value.trim()
            };

            // Validate
            if (!employeeData.firstName || !employeeData.lastName || 
                !employeeData.position || !employeeData.department || !employeeData.email) {
                showToast('กรุณากรอกข้อมูลให้ครบถ้วน (ช่องที่มี *)', 'error');
                return;
            }

            const id = employeeIdInput.value;
            const isEdit = !!id;
            
            try {
                if (isEdit) {
                    await updateEmployee(id, employeeData);
                    showToast('อัพเดทข้อมูลพนักงานเรียบร้อยแล้ว ✅', 'success');
                } else {
                    await addEmployee(employeeData);
                    showToast('เพิ่มพนักงานใหม่เรียบร้อยแล้ว 🎉', 'success');
                }
                closeModalFn();
                await fetchEmployees();
            } catch (error) {
                showToast('เกิดข้อผิดพลาด: ' + error.message, 'error');
            }
        });

        // Search and filter
        searchInput.addEventListener('input', filterEmployees);
        departmentFilter.addEventListener('change', filterEmployees);

        // ============== Initialize ==============
        fetchEmployees();
    </script>
</body>
</html>
